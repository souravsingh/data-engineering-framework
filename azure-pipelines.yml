trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: "3.11"
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip

stages:
  # ──────────────────────────────────────────────────────────────────────────
  - stage: Test
    displayName: "Lint & Test"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: LintAndTest
        displayName: "Ruff · mypy · pytest"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements-dev.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: "Cache pip packages"

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            displayName: "Install dependencies"

          - script: |
              ruff check src/ tests/
            displayName: "Ruff linter"

          - script: |
              mypy src/
            displayName: "mypy type check"

          - script: |
              pytest tests/ \
                --cov=src \
                --cov-report=xml:coverage.xml \
                --cov-report=html:htmlcov \
                --cov-report=term-missing \
                --junitxml=test-results.xml
            displayName: "pytest with coverage"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "test-results.xml"
              testRunTitle: "pytest results"
            displayName: "Publish test results"

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "coverage.xml"
              pathToSources: "$(System.DefaultWorkingDirectory)/src"
            displayName: "Publish coverage results"

  # ──────────────────────────────────────────────────────────────────────────
  - stage: SecurityScan
    displayName: "Security Scan"
    dependsOn: Test
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: Bandit
        displayName: "bandit SAST scan"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              python -m pip install --upgrade pip
              pip install bandit
            displayName: "Install bandit"

          - script: |
              bandit -r src/ \
                --exclude tests \
                --skip B101 \
                -f xml \
                -o bandit-results.xml || true
            displayName: "Run bandit"

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: "bandit-results.xml"
              ArtifactName: "bandit-report"
            displayName: "Publish bandit report"

  # ──────────────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: "Build Package"
    dependsOn: SecurityScan
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: BuildWheel
        displayName: "Build wheel & sdist"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              python -m pip install --upgrade pip build
              python -m build
            displayName: "Build distribution packages"

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: "dist/"
              ArtifactName: "python-dist"
            displayName: "Publish dist artifacts"
